<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SilkFrame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="toolbar pywebview-drag-region" id="toolbar">
    <svg class="icon icon--gold" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="9" width="7" height="14" rx="1"></rect>
      <rect x="12.5" y="9" width="7" height="14" rx="1" stroke-dasharray="2.5 2.5"></rect>
      <rect x="22" y="9" width="7" height="14" rx="1"></rect>
    </svg>
    <span class="toolbar__title">SilkFrame</span>
    <span class="toolbar__spacer"></span>
    <div class="wincontrols" id="wincontrols">
      <button class="wincontrol" id="win-min" type="button" aria-label="Minimise">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 5h9"></path></svg>
      </button>
      <button class="wincontrol" id="win-max" type="button" aria-label="Maximise">
        <svg viewBox="0 0 10 10" aria-hidden="true"><rect x="0.7" y="0.7" width="8.6" height="8.6"></rect></svg>
      </button>
      <button class="wincontrol wincontrol--close" id="win-close" type="button" aria-label="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.7 0.7l8.6 8.6M9.3 0.7l-8.6 8.6"></path></svg>
      </button>
    </div>
  </header>

  <div class="workspace">
    <main class="main">

      <!-- A div, not a section: pywebview finds an element's events two
           prototypes up, which is HTMLElement for a div but only Element for a
           section, and Element carries no ondrop - so a section here silently
           loses the drop. The queue lives inside it rather than beside it, so
           the whole panel stays one drop target however full it is. -->
      <div class="drop" id="drop" data-empty="true">
        <canvas class="drop__dots" id="dots"></canvas>
        <div class="drop__body">
          <svg class="icon icon--gold icon--lg" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="2" y="7" width="28" height="18" rx="1"></rect>
            <path d="M2 12h4M2 20h4M26 12h4M26 20h4M11 7v18M21 7v18"></path>
          </svg>
          <p class="drop__title">Drop videos here</p>
          <button class="pill" id="choose" type="button">Choose files</button>
        </div>
        <div class="queue" id="queue"></div>
        <div class="drop__more">
          <span class="meta" id="count"></span>
          <span class="meta">click one to change it - drag to reorder - drop more, or</span>
          <button class="drop__link" id="choose-more" type="button">choose files</button>
        </div>
      </div>

      <section class="pane">
        <div class="pane__head"><span class="caption">Log</span></div>
        <div class="log" id="log" aria-live="polite"></div>
      </section>

    </main>

    <aside class="side">

      <!-- Who the controls below are set to: every video in the list, or the
           one whose row was clicked. The second cell is only there once a row
           has been clicked, and carries that file's name. -->
      <p class="caption">Settings for</p>
      <div class="seg" role="radiogroup" aria-label="Settings for">
        <button class="seg__cell" id="scope-all" type="button" role="radio"
                aria-checked="true">All videos</button>
        <button class="seg__cell" id="scope-one" type="button" role="radio"
                aria-checked="false" hidden>
          <span class="scope__name" id="scope-name"></span>
        </button>
      </div>

      <p class="caption">Output</p>
      <div class="seg" role="radiogroup" aria-label="Output">
        <button class="seg__cell" type="button" role="radio" data-mode="fps" aria-checked="true">
          <svg class="icon" viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="9" width="7" height="14" rx="1"></rect>
            <rect x="12.5" y="9" width="7" height="14" rx="1" stroke-dasharray="2.5 2.5"></rect>
            <rect x="22" y="9" width="7" height="14" rx="1"></rect>
          </svg>Frame rate
        </button>
        <button class="seg__cell" type="button" role="radio" data-mode="slowmo" aria-checked="false">
          <svg class="icon" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12"></circle>
            <path d="M16 9v7l5 3"></path>
          </svg>Slow motion
        </button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Frames out per frame in">
        <button class="seg__cell" type="button" role="radio" data-factor="2" aria-checked="true">2x</button>
        <button class="seg__cell" type="button" role="radio" data-factor="3" aria-checked="false">3x</button>
        <button class="seg__cell" type="button" role="radio" data-factor="4" aria-checked="false">4x</button>
        <button class="seg__cell" type="button" role="radio" data-factor="8" aria-checked="false">8x</button>
      </div>
      <p class="note" id="note"></p>

      <p class="caption">Suffix</p>
      <label class="name">
        <span class="name__fixed">name.</span>
        <input class="name__input" id="suffix" type="text" maxlength="40"
               spellcheck="false" autocomplete="off" aria-label="Suffix">
      </label>

      <p class="caption">Device</p>
      <div class="select" id="device">
        <button class="select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="select__value"></span>
          <svg class="select__caret" viewBox="0 0 10 10" aria-hidden="true">
            <path d="M2 4l3 3 3-3"></path>
          </svg>
        </button>
        <div class="select__menu" role="listbox" hidden></div>
      </div>

    </aside>
  </div>

  <footer class="statusbar">
    <div class="statusbar__track"><div class="statusbar__fill" id="fill"></div></div>
    <span class="statusbar__text" id="status"></span>
    <span class="meta" id="percent"></span>
    <button class="pill" id="start" type="button" disabled>Start</button>
    <button class="ghost" id="stop" type="button" hidden>Stop</button>
    <button class="pill" id="close" type="button" hidden>Close</button>
  </footer>

  <!-- The window has no border of its own, so these eight strips are the
       resize handles: invisible, on top of everything, one per edge and
       corner. -->
  <div class="grip grip--n" data-edge="n"></div>
  <div class="grip grip--s" data-edge="s"></div>
  <div class="grip grip--w" data-edge="w"></div>
  <div class="grip grip--e" data-edge="e"></div>
  <div class="grip grip--nw" data-edge="nw"></div>
  <div class="grip grip--ne" data-edge="ne"></div>
  <div class="grip grip--sw" data-edge="sw"></div>
  <div class="grip grip--se" data-edge="se"></div>

</div>
<script src="app.js"></script>
</body>
</html>
